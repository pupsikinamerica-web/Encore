/* ---------- buttons, chips, forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:13px;font:600 14px/1 var(--f-ui);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:transform .25s var(--spring),background .2s,border-color .2s,box-shadow .25s,color .2s;text-decoration:none;white-space:nowrap;cursor:pointer}

.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.fld{display:grid;gap:7px;min-width:0;align-content:start}
.fld>label,.flabel{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea,.fld select,.sel{width:100%;border-radius:13px;border:1px solid var(--line-2);background:var(--surface-2);padding:12px 14px;font-size:16px;line-height:1.4;transition:border-color .2s,box-shadow .2s,background .2s}
.fld textarea{resize:vertical;min-height:52px}
.fld input:focus,.fld textarea:focus,.fld select:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.fld textarea.serif{font:500 21px/1.3 var(--f-display)}
.fld-h{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.fld.err input,.fld.err textarea{border-color:var(--again);box-shadow:0 0 0 4px color-mix(in srgb,var(--again) 14%,transparent)}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}
.msg-bad{color:var(--again)}
.msg-ok{color:var(--good)}
.tgl{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;line-height:1.3}
.tgl input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;transition:background .25s;flex:none;margin:0;cursor:pointer}
.tgl input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .4s var(--spring)}
.tgl input:checked{background:var(--accent)}
.tgl input:checked::after{transform:translateX(18px)}
.tgl small{display:block;color:var(--muted);font-size:12px}
.range{width:100%;accent-color:var(--accent);height:28px}

/* ---------- dropdown ---------- */
.dd{position:relative;min-width:0}
.dd.open{z-index:40}
.lib-tools,.add-card,.dr{position:relative;z-index:5}
.dd-b{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border-radius:13px;border:1px solid var(--line-2);background:var(--surface-2);padding:11px 14px;font-size:16px;line-height:1.4;color:var(--ink);text-align:left;transition:border-color .2s,box-shadow .2s,background .2s}
.dd-b:hover{border-color:var(--ink-2)}
.dd-l{display:flex;align-items:center;gap:10px;min-width:0}
.dd-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-b>svg{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .4s var(--spring)}
.dd.open .dd-b{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.dd.open .dd-b>svg{transform:rotate(180deg);color:var(--accent-text)}
.dd-m{position:absolute;z-index:30;top:calc(100% + 8px);left:0;right:0;min-width:210px;max-height:290px;overflow:auto;overscroll-behavior:contain;padding:6px;border-radius:17px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);transform-origin:top center;animation:ddIn .32s var(--spring) both}
@keyframes ddIn{from{opacity:0;transform:translateY(-8px) scale(.96)}}
.dd-o{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;font:500 14.5px/1.3 var(--f-ui);color:var(--ink);transition:background .15s;animation:rise .3s var(--ease) both;animation-delay:calc(min(var(--i),10)*25ms)}
.dd-o:hover,.dd-o:focus-visible{background:var(--bg-2);outline:none}
.dd-o .dd-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-o>svg{width:16px;height:16px;flex:none;color:var(--accent-text);opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--spring)}
.dd-o[aria-selected="true"]{font-weight:600}
.dd-o[aria-selected="true"]>svg{opacity:1;transform:none}
.dd .av,.dd .dd-me{width:26px;height:26px;font-size:11px}
.dd-me{display:grid;place-items:center;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-text)}
.dd-me svg{width:13px;height:13px}
.dd.sm .dd-b{height:38px;padding:0 12px;font-size:13px;border-radius:12px;background:var(--surface)}
.dd.sm .dd-m{left:auto;right:0}

/* ---------- covers ---------- */
.cover{position:relative;isolation:isolate;overflow:hidden;border-radius:26px;min-height:clamp(200px,24vw,260px);padding:clamp(20px,3vw,30px);display:flex;flex-direction:column;justify-content:flex-end;gap:6px;color:var(--stage-ink);background:var(--stage);margin-bottom:16px;animation:rise .7s var(--ease) both}
.cover-img{position:absolute;top:0;bottom:0;right:0;left:auto;height:100%;width:auto;max-width:100%;aspect-ratio:3/2;z-index:-2;background:center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%);animation:kb 22s ease-in-out infinite alternate;transform-origin:60% 50%}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(95deg,rgba(17,15,31,.78) 0%,rgba(17,15,31,.35) 45%,rgba(17,15,31,0) 75%)}
.cover-bg{position:absolute;inset:-40px;z-index:-3;background:center/cover no-repeat;filter:blur(34px) saturate(1.15);opacity:.8}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.035)}}
.cover h2{margin:0;font:italic 600 clamp(34px,5vw,48px)/1 var(--f-display);letter-spacing:-.01em}
.cover p{margin:0;font:500 12px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--stage-muted);text-transform:uppercase}
.cover .btn{align-self:flex-start;margin-top:10px;background:var(--stage-ink);color:var(--stage);border-color:transparent}
.cover.tall{min-height:clamp(240px,30vw,300px)}
@media (max-width:640px){
  .cover,.cover.tall{min-height:0;aspect-ratio:3/2}
  .cover-img{inset:0;width:100%;height:100%;aspect-ratio:auto;-webkit-mask-image:none;mask-image:none}
  .cover-bg{display:none}
  .cover::before{background:linear-gradient(0deg,rgba(17,15,31,.86) 0%,rgba(17,15,31,.35) 45%,rgba(17,15,31,0) 70%)}
}
.stage.moon::before{background:linear-gradient(100deg,rgba(17,15,31,.86) 0%,rgba(17,15,31,.55) 42%,rgba(17,15,31,.1) 72%),var(--moon) 70% 50%/cover no-repeat,var(--stage)}
.stage.moon .stage-mix,.stage.moon .stage-legend{color:var(--stage-ink);text-shadow:0 1px 14px rgba(10,8,22,.9)}
.stage.moon .stage-legend{opacity:.7}
@media (max-width:600px){.stage.moon::before{background:linear-gradient(180deg,rgba(17,15,31,.5) 0%,rgba(17,15,31,.62) 40%,rgba(17,15,31,.82) 75%,rgba(17,15,31,.9) 100%),var(--moon) 57% 50%/cover no-repeat,var(--stage)}}

/* ---------- library ---------- */
.lib-tools{display:grid;gap:12px;margin-bottom:18px}
.search{position:relative;display:block}
.search svg{position:absolute;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{-webkit-appearance:none;appearance:none;width:100%;height:50px;padding:0 16px 0 44px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);font-size:16px;transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lib-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.lib-row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sel{width:auto;height:38px;padding:0 12px;font-size:13px;border-radius:12px;background:var(--surface)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.it{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .4s var(--spring),border-color .25s,box-shadow .4s;animation:rise .6s var(--ease) both;animation-delay:calc(min(var(--i),14)*35ms);min-width:0;width:100%}

.it-top .due.now{color:var(--glow)}
.it-q{margin:0;font:500 22px/1.22 var(--f-display);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty;overflow-wrap:break-word}
.it-pt{font:italic 600 24px/1.15 var(--f-display)}
.it-pl{margin:-4px 0 0;font:500 18px/1.3 var(--f-display);color:var(--ink-2);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-w{font:700 23px/1.15 var(--f-ui);letter-spacing:-.015em;overflow-wrap:anywhere}
.it-m{color:var(--ink-2);font-size:14px;margin-top:-6px;overflow-wrap:anywhere}
.it-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;font:500 11px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.it-foot>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lad{display:inline-flex;gap:2px;flex:none}
.lad i{width:4px;height:12px;border-radius:2px;background:var(--line-2)}
.lad i.on{background:var(--accent)}
.lad.m i.on{background:var(--good)}
.pdots{display:inline-flex;gap:4px;flex:none}
.pdots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.pdots i.on{background:var(--accent)}
.pdots i.m{background:var(--good)}
.empty{padding:44px 22px;text-align:center;border:1.5px dashed var(--line-2);border-radius:24px;color:var(--ink-2)}
.empty h3{font:italic 600 32px/1.1 var(--f-display);margin:0 0 8px;color:var(--ink)}
.empty p{margin:0 auto 18px;max-width:44ch}
.empty.sm{padding:28px 18px}
.empty.sm h3{font-size:26px}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fade .3s both;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{position:relative;width:100%;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:sheetUp .55s var(--ease) both}
.sheet-grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 10px}
.sheet-x{position:sticky;top:0;float:right;z-index:2;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--bg-2);color:var(--ink-2);margin:0 0 6px 10px}
.sheet-x svg{width:18px;height:18px}
.sheet-wrap.out{animation:fade .28s reverse both}
.sheet-wrap.out .sheet{animation:sheetDown .3s var(--ease) both}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.2}}
@keyframes sheetDown{to{transform:translateY(60px);opacity:0}}
@media (min-width:760px){
  .sheet-wrap{align-items:center;padding:28px}
  .sheet{max-width:700px;max-height:90vh;border-radius:28px;padding:28px 32px 32px}
  .sheet-grab{display:none}
}
.sh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 12.5px/1 var(--f-ui);color:var(--muted);margin:6px 0 18px}
.sh-q{margin:0;font:500 clamp(26px,4.4vw,36px)/1.18 var(--f-display);text-wrap:pretty;overflow-wrap:break-word}
.sh-by{margin-top:12px;font:500 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-tr{margin:14px 0 0;color:var(--ink-2)}
.sh-note{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px;color:var(--ink-2)}
.sh-note b{color:var(--ink);font-weight:600}
.sh-sec{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.sh-sec .flabel{display:block;margin-bottom:12px}
.sh-w{font:700 clamp(32px,6vw,46px)/1.05 var(--f-ui);letter-spacing:-.02em;overflow-wrap:anywhere}
.sh-mean{margin-top:8px;font:500 20px/1.3 var(--f-ui);color:var(--ink-2)}
.sh-ex{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--surface-2);font:500 20px/1.35 var(--f-display)}
.sh-ex span{display:block;margin-top:4px;font:400 14px/1.4 var(--f-ui);color:var(--muted)}
.sh-poem{display:grid;gap:18px}
.sh-st{font:500 21px/1.38 var(--f-display);white-space:pre-line}
.sh-st small{display:block;margin-top:6px;font:400 13.5px/1.45 var(--f-ui);color:var(--muted);white-space:normal}
.tr-out{margin-top:14px;display:grid;gap:16px;font:500 22px/1.42 var(--f-display)}
.tr-out p{margin:0}
.fw{display:inline-block;vertical-align:baseline;padding:0 1px;border-radius:5px;color:var(--accent-text)}
.fw i,.fl-w i{display:inline-block;width:calc(var(--n)*.42em);height:.1em;border-bottom:2px dotted currentColor;margin-left:1px}
.fw:hover{background:var(--accent-soft)}
.fl-w{white-space:nowrap}
.units{display:grid;gap:14px}
.unit-h{display:flex;justify-content:space-between;gap:10px;font:500 12px/1.2 var(--f-mono);color:var(--ink-2);letter-spacing:.04em}
.unit-h span:last-child{color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:8px}
.track i{height:8px;border-radius:3px;background:var(--bg-2)}
.track i.on{background:color-mix(in srgb,var(--accent) 55%,var(--bg-2))}
.track i.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.track.m i.on,.track.m i.cur{background:var(--good);box-shadow:none}
.track-l{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font:500 9px/1 var(--f-mono);color:var(--muted);text-align:center;margin-bottom:2px}
.sh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.sh-stats div{padding:12px;border-radius:14px;background:var(--surface-2)}
.sh-stats b{display:block;font:600 24px/1 var(--f-display);font-variant-numeric:lining-nums}
.sh-stats span{font:500 10px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-acts{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}

/* ---------- add ---------- */
.add-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.add-grid{grid-template-columns:1fr}}
.add-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,28px)}
.pv{position:sticky;top:24px;display:grid;gap:10px;min-width:0}
.pv-stage{position:relative;overflow:hidden;isolation:isolate;background:var(--stage);color:var(--stage-ink);border-radius:26px;padding:26px;min-height:280px}
.pv-stage::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(17,15,31,.45),rgba(17,15,31,.45)),var(--stage-img) 70% 30%/cover no-repeat}
.pv-stage .lang{--lc:var(--sky-xx)}.pv-stage .lang.l-fr{--lc:var(--sky-fr)}.pv-stage .lang.l-it{--lc:var(--sky-it)}.pv-stage .lang.l-en{--lc:var(--sky-en)}.pv-stage .lang.l-ru{--lc:var(--sky-ru)}
.pv-meta{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stage-muted);margin-bottom:18px}
.pv-sit{margin:0;font:500 19px/1.35 var(--f-ui)}
.pv-key{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--stage-2);font:italic 500 17px/1 var(--f-display)}
.pv-key i{font:500 9.5px/1 var(--f-mono);font-style:normal;letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;border-radius:99px;background:var(--stage-3);color:var(--stage-muted)}
.pv-div{display:flex;align-items:center;gap:10px;margin:20px 0 16px;font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--stage-muted)}
.pv-div::before,.pv-div::after{content:"";flex:1;height:1px;background:var(--stage-line)}
.pv-q{margin:0;font:500 26px/1.2 var(--f-display);overflow-wrap:break-word}
.pv-by{margin-top:10px;font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stage-muted)}
.pv-tr{margin:12px 0 0;color:var(--stage-muted);font-size:14px}
.pv-pt{font:italic 600 26px/1.15 var(--f-display);margin-bottom:14px}
.pv-st{display:grid;grid-template-columns:22px 1fr;gap:10px;margin-bottom:12px}
.pv-st p{margin:0;font:500 19px/1.35 var(--f-display)}
.pv-sn{font:500 11px/1.8 var(--f-mono);color:var(--stage-muted)}
.pv-more{margin:8px 0 0;font:500 11.5px/1 var(--f-mono);color:var(--stage-muted)}
.pv-w{font:700 36px/1.05 var(--f-ui);letter-spacing:-.02em;overflow-wrap:anywhere}
.pv-pron{margin-top:8px;font:400 14px/1.3 var(--f-mono);color:var(--stage-muted)}
.pv-mean{font:600 24px/1.2 var(--f-ui)}
.pv-ex{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--stage-2);font:500 18px/1.3 var(--f-display)}
.pv-ex span{display:block;margin-top:4px;font:400 13px/1.4 var(--f-ui);color:var(--stage-muted)}
.pv-list{display:grid;gap:2px}
.pv-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--stage-line);animation:rise .4s var(--ease) both}
.pv-row b{font-weight:700;overflow-wrap:anywhere}
.pv-row span{color:var(--stage-muted);overflow-wrap:anywhere}
.pv-note{margin:0;font:500 12px/1.4 var(--f-mono);color:var(--muted);min-height:1.4em}

/* ---------- students ---------- */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.stu{display:grid;gap:16px;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:transform .4s var(--spring),border-color .25s,box-shadow .4s;animation:rise .6s var(--ease) both;animation-delay:calc(min(var(--i),12)*45ms)}

.stu-h{display:flex;align-items:center;gap:12px;min-width:0}

.stu-n{font:600 18px/1.2 var(--f-ui);overflow-wrap:anywhere}
.stu-s{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{padding:10px 12px;border-radius:14px;background:var(--surface-2);min-width:0}
.kv b{display:block;font:600 26px/1 var(--f-display);font-variant-numeric:lining-nums}
.kv span{font:500 9.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stu-foot{display:flex;justify-content:space-between;gap:10px;font:500 11.5px/1.2 var(--f-mono);color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--f-ui);color:var(--muted);text-decoration:none;margin-bottom:12px;padding:6px 0}
.back svg{width:16px;height:16px}
.back:hover{color:var(--ink)}
.st-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.st-hero .av{width:66px;height:66px;font-size:26px}
.st-hero h1{margin:0}
.st-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.dr>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 15px/1.25 var(--f-ui)}
.dr>summary::-webkit-details-marker{display:none}
.dr>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .35s var(--spring)}

  const units = unitsFor(st.id); const mastered = units.filter((u) => u.s && u.s.l >= MASTER).length;
  const items = new Set(units.map((u) => u.it.id)).size;
  return { due: stuDue(st.id), items, pct: units.length ? Math.round(mastered / units.length * 100) : 0, mem: memoryOf(units), units };
}
function lastHome(st) {
  const days = Object.entries(st.home || {}).filter(([, n]) => n > 0).map(([d]) => d).sort(); if (!days.length) return null;
  const last = days[days.length - 1]; const [y, m, d] = last.split('-').map(Number); const dd = Math.round((lday(Date.now()) - new Date(y, m - 1, d)) / DAY);
  return dd <= 0 ? 'сегодня' : dd === 1 ? 'вчера' : dd + ' ' + plural(dd, ['день', 'дня', 'дней']) + ' назад';
}

async function importBackup(file) {
  let o; try { o = JSON.parse(await file.text()); } catch (e) { toast('Это не похоже на резервную копию Encore.', 'bad'); return; }
  if (!o || o.app !== 'encore') { toast('Это не похоже на резервную копию Encore.', 'bad'); return; }
  const items = (o.items || []).filter((x) => x && x.id), studs = (o.students || []).filter((x) => x && x.id), logs = Object.entries(o.log || {});
  toast(`Загружаю: ${items.length} ${plural(items.length, ['карточка', 'карточки', 'карточек'])}…`);
  for (const st of studs) await put('students', st.id, st);
  for (const it of items) await put('items', it.id, it);
  for (const [k, v] of logs) await put('log', k, v);
  if (o.settings) { S.settings = { ...DEF, ...o.settings }; await putSettings(); }
  toast('Копия загружена'); scheduleRender();
}

  const sec = Math.round((Date.now() - R.t0) / 1000); const time = Math.floor(sec / 60) + ':' + pad(sec % 60);
  const tomorrow = dayStart(Date.now()) + 2 * DAY; const nextN = unitsFor(R.owner).filter((u) => u.s && u.s.d < tomorrow && u.s.d > Date.now()).length;
  const more = R.opts.mode !== 'all' && R.opts.mode !== 'ahead' ? plan(R.owner, R.opts).all.length : 0;
  const L = ['Забыл', 'Трудно', 'Помню', 'Легко'];
  $('#rv-card').classList.remove('in');
  $('#rv-card').innerHTML = `<div class="rv-end"><canvas class="burst" aria-hidden="true"></canvas><div class="eyebrow" style="color:var(--stage-muted)">${R.lesson ? 'Повторение на уроке завершено' : 'Сессия завершена'}</div><h2 class="bravo">Браво!</h2>
    <div class="end-stats"><div style="--i:0"><b>${n}</b><span>${plural(n, ['карточка', 'карточки', 'карточек'])}</span></div><div style="--i:1"><b>${time}</b><span>время</span></div><div style="--i:2"><b>${pct}%</b><span>вспомнил</span></div></div>
    <div class="dist">${R.res.map((c, g) => c ? `<i class="g${g}" style="--f:${c}"></i>` : '').join('')}</div><div class="dist-l">${R.res.map((c, g) => `<span class="g${g}">${L[g]} ${c}</span>`).join('')}</div>
    ${willSend ? '<p class="end-tg" id="end-tg">Отправляю результат репетитору…</p>' : ''}<p class="end-next">${nextN ? `До конца завтрашнего дня вернётся ${nextN} ${plural(nextN, ['карточка', 'карточки', 'карточек'])}.` : 'Следующие повторения назначены, Encore напомнит о них числом на главной.'}</p></div>`;
  $('#rv-foot').innerHTML = `<div class="end-act" style="width:100%">${more ? `<button class="rv-btn" data-r="again">Ещё ${more}</button>` : ''}<button class="rv-btn primary" data-r="done">Готово</button></div>`;
  const cv = $('.rv .burst'); if (cv) { const box = $('.rv'); cv.style.position = 'fixed'; requestAnimationFrame(() => burst(cv)); void box; }
}

/* ---------- telegram: student reports go straight to the tutor ---------- */
function tgCfg() { const t = STUDENT && STUDENT.tg; if (!t || !t.p || !t.c) return null; return { token: t.p.join(''), chat: String(t.c) }; }
const PEND_KEY = STUDENT ? 'encore.pending.' + STUDENT.sid : '';
function reportText(sum) {
  const units = unitsFor('me'); const mastered = units.filter((u) => u.s && u.s.l >= MASTER).length; const st = streak(S.log);
  const lines = [`<b>Encore · ${esc(STUDENT.name)}</b>`];
  if (sum) {
    lines.push(`${sum.partial ? 'Прервал повторение' : 'Повторение завершено'}: ${sum.n} ${plural(sum.n, ['карточка', 'карточки', 'карточек'])} за ${sum.time}, вспомнил ${sum.pct}%`);
    if (sum.forgot.length) lines.push(`Не вспомнил: ${esc(sum.forgot.slice(0, 10).join(', '))}${sum.forgot.length > 10 ? '…' : ''}`);
  } else lines.push('Досылаю прогресс, который не ушёл в прошлый раз');
  lines.push(`Серия: ${st} ${plural(st, ['день', 'дня', 'дней'])} подряд · в долгой памяти ${mastered} из ${units.length}`);
  return lines.join('\n');
}
async function tgSend(sum) {
  const cfg = tgCfg(); if (!cfg) return null;
  const head = reportText(sum); const code = progressCode(); const api = 'https://api.telegram.org/bot' + cfg.token;
  try {
    const text = head + '\n\nКод для Encore (нажми, чтобы скопировать):\n<code>' + esc(code) + '</code>';
    let res;
    if (text.length < 3900) res = await fetch(api + '/sendMessage', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: cfg.chat, text, parse_mode: 'HTML', disable_web_page_preview: true }) });
    else { const fd = new FormData(); fd.append('chat_id', cfg.chat); fd.append('caption', head + '\n\nКод прогресса в файле.'); fd.append('parse_mode', 'HTML'); fd.append('document', new Blob([code], { type: 'text/plain' }), 'encore-' + slug(STUDENT.name) + '.txt'); res = await fetch(api + '/sendDocument', { method: 'POST', body: fd }); }
    const j = await res.json(); if (j && j.ok) { LS.set(PEND_KEY, false); return true; }
  } catch (e) { /* offline or blocked */ }
  LS.set(PEND_KEY, true); return false;
}
function sessionSummary(partial) {
  const n = R.reviews; const ok = R.res[1] + R.res[2] + R.res[3]; const sec = Math.round((Date.now() - R.t0) / 1000);
  return { n, pct: n ? Math.round(ok / n * 100) : 0, time: Math.floor(sec / 60) + ':' + pad(sec % 60), forgot: [...(R.forgot || [])], partial };
}

/* ---------- students: file & progress code ---------- */
function buildStudentFile(st) {
  const items = [...S.items.values()].filter((i) => i.owner === st.id).map((i) => { const o = { ...i }; delete o.owner; return o; });
  const tg = S.settings.tg && S.settings.tg.token && S.settings.tg.chat ? { p: String(S.settings.tg.token).match(/.{1,6}/g), c: String(S.settings.tg.chat) } : null;
  const data = { v: 1, sid: st.id, name: st.name, lang: st.lang || 'en', newPerDay: st.newPerDay || 10, intensity: S.settings.intensity, dayHour: S.settings.dayHour == null ? 4 : S.settings.dayHour, items, made: Date.now(), tg, art: ART.moon ? { moon: ART.moon } : {} };
  const css = ($('#encore-style') || {}).textContent || ''; const js = ($('#encore-script') || {}).textContent || '';
  const json = JSON.stringify(data).replace(/</g, '\\u003c').replace(new RegExp(String.fromCharCode(0x2028), 'g'), '\\u2028').replace(new RegExp(String.fromCharCode(0x2029), 'g'), '\\u2029');
  const SC = 'scr' + 'ipt';
  return '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#110F1F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Encore"><link rel="apple-touch-icon" href="' + ICON_URI + '"><link rel="icon" href="' + ICON_URI + '"><title>' + esc('Encore · ' + st.name) + '</title>' + FONT_LINKS + '<style>' + css + '</style></head><body><div id="app"></div><' + SC + '>window.__ENCORE_STUDENT__=' + json + ';</' + SC + '><' + SC + '>' + js + '</' + SC + '></body></html>';
}
function progressCode() {
  const b = (n) => Math.max(0, Math.round(n)).toString(36); const parts = [];
  for (const it of S.items.values()) for (const [k, s] of Object.entries(it.srs || {})) if (s) parts.push(`${it.id}.${k}:${b(s.l)},${b(s.d / MIN)},${b(s.t / MIN)},${b(s.r || 0)},${b(s.x || 0)},${b((s.f || s.t) / MIN)}`);
  const since = Date.now() - 60 * DAY;
  const days = [...S.log.entries()].filter(([d, v]) => new Date(d).getTime() > since && v && v.n).map(([d, v]) => d.replace(/-/g, '') + ':' + v.n).join(',');
  return `ENCORE1|${STUDENT.sid}|${parts.join(';')}|${days}`;
}
function parseProgress(text) {
  const m = String(text || '').replace(/\s+/g, '').match(/ENCORE1\|([A-Za-z0-9_-]+)\|([^|]*)\|([0-9:,]*)/); if (!m) return null;
  const units = [];
  if (m[2]) for (const p of m[2].split(';')) { const ci = p.indexOf(':'); if (ci < 0) continue; const key = p.slice(0, ci); const di = key.lastIndexOf('.'); if (di < 0) continue; const v = p.slice(ci + 1).split(',').map((x) => parseInt(x, 36)); if (v.length < 6 || v.some((x) => isNaN(x))) continue; units.push({ iid: key.slice(0, di), k: key.slice(di + 1), s: { l: Math.min(TOP, v[0]), d: v[1] * MIN, t: v[2] * MIN, r: v[3], x: v[4], f: v[5] * MIN } }); }
  const days = {}; if (m[3]) for (const p of m[3].split(',')) { const [d, n] = p.split(':'); if (d && d.length === 8) days[d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6)] = +n || 0; }
  return { sid: m[1], units, days };
}
function applyProgress(st, P) {
  let upd = 0; const byItem = new Map();
  for (const u of P.units) { const it = S.items.get(u.iid); if (!it || it.owner !== st.id) continue; const cur = it.srs && it.srs[u.k]; if (!cur || u.s.t > (cur.t || 0)) { if (!byItem.has(it.id)) byItem.set(it.id, {}); byItem.get(it.id)[u.k] = u.s; upd++; } }
  for (const [id, srs] of byItem) patch('items', id, { srs });
  const home = { ...(st.home || {}) }; for (const [d, n] of Object.entries(P.days)) home[d] = Math.max(home[d] || 0, n);
  patch('students', st.id, { home, homeSync: Date.now() });
  return { upd, days: Object.values(P.days).filter((n) => n > 0).length };
}

/* ---------- actions ---------- */
const ACTS = {
  'cloud-login': () => cloudLogin(),
  'cloud-signout': () => firebaseAuth && firebaseAuth.signOut(),
  'cloud-import': () => cloudImport(),
  'tg-test': async () => { const token = ($('#tg-token') || {}).value.trim(), chat = ($('#tg-chat') || {}).value.trim(); const msg = $('#tg-msg'); if (!token || !chat) { msg.textContent = 'Заполни токен и Chat ID.'; msg.className = 'fld-h msg-bad'; return; } msg.textContent = 'Проверяю…'; msg.className = 'fld-h'; try { const r = await fetch('https://api.telegram.org/bot' + token + '/sendMessage', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: chat, text: 'Encore: проверка связи. Сюда будут приходить результаты учеников.' }) }); const j = await r.json(); msg.textContent = j.ok ? 'Работает: проверь сообщение от бота.' : 'Telegram ответил: ' + (j.description || 'ошибка'); msg.className = 'fld-h ' + (j.ok ? 'msg-ok' : 'msg-bad'); } catch (e) { msg.textContent = 'Отсюда Claude не пускает запросы в Telegram, проверка пройдёт только в файле ученика. Просто сохрани.'; msg.className = 'fld-h'; } },
  sound: () => toggleSound(),
  start: (b) => startSession('me', {}, b),
  ahead: (b) => startSession('me', { mode: 'ahead', title: 'Повторение заранее' }, b),
  group: (b) => { const sid = b.dataset.sid, g = b.dataset.g; startSession(sid, { mode: 'all', lesson: sid !== 'me', filter: (it) => (it.lesson || 'Без урока') === g, title: g }, b); },
  'stu-lesson': (b) => { const st = S.students.get(b.dataset.sid); if (st) startSession(st.id, { lesson: true, unlimited: true, title: 'Урок · ' + st.name }, b); },
  'stu-ahead': (b) => { const st = S.students.get(b.dataset.sid); if (st) startSession(st.id, { lesson: true, mode: 'ahead', title: 'Урок · ' + st.name }, b); },
  'stu-new': () => { const f = $('#stu-form'); if (!f) return; f.hidden = false; f.style.animation = 'rise .5s var(--ease) both'; requestAnimationFrame(() => { $$('.seg', f).forEach(segSync); $('#n-name').focus(); }); },
  'stu-cancel': () => { const f = $('#stu-form'); if (f) f.hidden = true; },
  'stu-del': (b) => armConfirm(b, 'Точно удалить вместе со словами?', () => { const sid = b.dataset.sid; for (const it of [...S.items.values()]) if (it.owner === sid) del('items', it.id); del('students', sid); toast('Ученик удалён'); location.hash = '#students'; }),
  'stu-file': async (b) => { const st = S.students.get(b.dataset.sid); if (!st) return; const html = buildStudentFile(st); const r = await offerFile('encore-' + slug(st.name) + '.html', html); if (r === 'saved') toast('Файл готов. Залей его на GitHub Pages или отправь ученику.'); else if (r === 'none') { const ok = await copyText(html, $('#sf-fb')); toast(ok ? 'Скачивание недоступно здесь, поэтому HTML скопирован. Вставь его в файл .html.' : 'Скачивание недоступно. Скопируй HTML из поля ниже.'); } },
  'stu-file-copy': async (b) => { const st = S.students.get(b.dataset.sid); if (!st) return; const ok = await copyText(buildStudentFile(st), $('#sf-fb')); toast(ok ? 'HTML скопирован. Вставь его в файл с расширением .html.' : 'Скопируй HTML из поля ниже.'); },
  'stu-import': (b) => { const st = S.students.get(b.dataset.sid); const msg = $('#si-msg'); if (!st) return; const P = parseProgress(($('#si-code') || {}).value); if (!P) { msg.textContent = 'Не нашёл код. Он начинается с ENCORE1.'; msg.className = 'fld-h msg-bad'; return; } if (P.sid !== st.id) { const other = S.students.get(P.sid); msg.textContent = other ? `Это код ученика «${other.name}». Открой его страницу и вставь туда.` : 'Этот код от файла другого ученика.'; msg.className = 'fld-h msg-bad'; return; } const res = applyProgress(st, P); $('#si-code').value = ''; msg.textContent = `Готово: обновлено ${res.upd} ${plural(res.upd, ['карточка', 'карточки', 'карточек'])}, дома занимался ${res.days} ${plural(res.days, ['день', 'дня', 'дней'])} за последние два месяца.`; msg.className = 'fld-h msg-ok'; toast('Прогресс ' + st.name + ' обновлён'); scheduleRender(); },
  'share-progress': async () => { const text = `Мой прогресс в Encore (${STUDENT.name}):\n${progressCode()}`; if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } } const ok = await copyText(text, $('#pg-fb')); toast(ok ? 'Скопировано. Вставь сообщение в чат с репетитором.' : 'Скопируй текст из поля ниже и отправь репетитору.'); },
  'copy-progress': async () => { const ok = await copyText(`Мой прогресс в Encore (${STUDENT.name}):\n${progressCode()}`, $('#pg-fb')); toast(ok ? 'Скопировано. Вставь сообщение в чат с репетитором.' : 'Скопируй текст из поля ниже и отправь репетитору.'); },
  'it-review': (b) => { const it = S.items.get(b.dataset.id); if (!it) return; const owner = ownerOf(it); startSession(owner, { mode: 'all', keepOrder: true, lesson: owner !== 'me' && !STUDENT, filter: (x) => x.id === it.id, title: 'Одна карточка' }, b); },
  'it-edit': (b) => openEdit(b.dataset.id),
  'it-reset': (b) => armConfirm(b, 'Точно сбросить?', () => { const it = S.items.get(b.dataset.id); if (!it) return; put('items', it.id, { ...it, srs: {} }); closeSheet(); toast('Прогресс карточки сброшен'); scheduleRender(); }),
  'it-del': (b) => armConfirm(b, 'Точно удалить?', () => { sfx('del'); del('items', b.dataset.id); closeSheet(); toast('Карточка удалена'); scheduleRender(); }),
  int: (b) => { S.settings = { ...S.settings, intensity: b.dataset.k }; putSettings(); $$('.int').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); toast('Режим «' + INT[b.dataset.k].name + '» включён'); },
  backup: async () => { const data = JSON.stringify({ app: 'encore', v: 1, at: new Date().toISOString(), ...snapshotState() }); const r = await offerFile('encore-backup-' + todayKey() + '.json', data); if (r === 'saved') toast('Резервная копия сохранена'); else if (r === 'none') { const ok = await copyText(data, $('#bk-fb')); toast(ok ? 'Скачивание недоступно, копия скопирована в буфер.' : 'Скопируй копию из поля ниже.'); } },
  reset: (b) => armConfirm(b, 'Точно сбросить весь прогресс?', async () => { const list = [...S.items.values()].filter((i) => ownerOf(i) === 'me' && i.srs && Object.keys(i.srs).length); for (const it of list) await put('items', it.id, { ...it, srs: {} }); toast('Прогресс сброшен'); scheduleRender(); }),
};
document.addEventListener('click', (e) => {
  if (e.target.closest('.rv')) return;
  const tk = e.target.closest('.dd-b,.dd-o,.nl,.seg button,.int,summary,.lnk,.stu-chip,.stu,.btn,.brand'); if (tk && !tk.matches('[data-act="sound"],[data-act="it-del"]')) sfx('tick');
  const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); openItem(o.dataset.open); return; }
  const a = e.target.closest('[data-act]'); if (a && ACTS[a.dataset.act]) { e.preventDefault(); ACTS[a.dataset.act](a, e); }
});
document.addEventListener('keydown', (e) => {
  if (R) {
    if (R.ended) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); closeReview(); } return; }
    if (e.key === 'Escape') { e.preventDefault(); closeReview(); return; }
    const C = R.C; if (!C || isTyping(e.target) || R.busy) return;
    if (!C.revealed) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (C.stage === 'ladder' && C.shown < C.lines.length) nextLine(); else if (C.stage !== 'build') reveal(); } return; }
    if (['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); grade(+e.key - 1); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); grade(C.sug == null ? 2 : C.sug); }
    return;
  }
  if (e.key === 'Escape' && $('.dd.open')) { $$('.dd.open').forEach(ddClose); return; }
  if (SHEET && e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Enter' && !SHEET && !isTyping(e.target) && !(e.target.closest && e.target.closest('a,button,summary')) && route().v === 'today') { const b = $('[data-act="start"]'); if (b) { e.preventDefault(); b.click(); } }
});
window.addEventListener('hashchange', () => { closeSheet(true); render(); });
window.addEventListener('resize', debounce(() => { syncNav(); $$('.seg').forEach(segSync); }, 120));
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleRender(); });
setInterval(() => { if (!document.hidden && !R && CUR && CUR.r && CUR.r.v === 'today') scheduleRender(); }, 60000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { syncNav(); $$('.seg').forEach(segSync); });

/* ---------- boot ---------- */
function initStudent() {
  const st = STUDENT; const saved = LS.get(LOCAL_KEY) || {};
  S.settings = { ...DEF, intensity: st.intensity || 'dense', newPerDay: st.newPerDay || 10, dayHour: st.dayHour == null ? 4 : st.dayHour };
  S.items = new Map();
  for (const it of st.items || []) { const loc = (saved.srs && saved.srs[it.id]) || {}; const srs = { ...(it.srs || {}) }; for (const [k, s] of Object.entries(loc)) if (s && (!srs[k] || (s.t || 0) > (srs[k].t || 0))) srs[k] = s; S.items.set(it.id, normItem({ ...it, owner: 'me', srs })); }
  S.log = new Map(Object.entries(saved.log || {}));
  S.mode = 'student'; S.ready = true;
}
function subscribeDb() {
  const db = B.db; const seen = new Set(['items', 'students', 'log', 'settings']);
  const first = (name) => { if (seen.delete(name) && !seen.size) { S.ready = true; S.stale = false; } scheduleRender(); saveLocalSoon(); };
  const onErr = (e) => { console.warn('Encore sync', e); if (e && e.code === 'revoked') S.readOnly = true; toast('Синхронизация прервалась. Обнови страницу, если данные не обновляются.', 'bad'); };
  cloudListeners.push(db.collection('items').onSnapshot((snap) => { S.items = new Map(snap.docs.map((d) => [d.id, normItem(Object.assign({ id: d.id }, d.data()))])); first('items'); }, onErr));
  cloudListeners.push(db.collection('students').onSnapshot((snap) => { S.students = new Map(snap.docs.map((d) => [d.id, Object.assign({ id: d.id }, d.data())])); first('students'); }, onErr));
  cloudListeners.push(db.collection('log').onSnapshot((snap) => { S.log = new Map(snap.docs.map((d) => [d.id, d.data()])); first('log'); }, onErr));
  cloudListeners.push(db.doc('meta/settings').onSnapshot((d) => { if (d.exists) { S.settings = { ...DEF, ...d.data() }; S.items = new Map([...S.items].map(([k, it]) => [k, normItem(it)])); } first('settings'); }, onErr));
}
async function boot() {
  buildShell();
  if (STUDENT) { initStudent(); render(); if (tgCfg() && LS.get(PEND_KEY)) setTimeout(() => tgSend(null), 1500); return; }
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { S.mode = 'local'; loadState(LS.get(LOCAL_KEY)); S.ready = true; render(); initFirebaseSync(); return; }
  S.mode = 'boot';
  const cached = LS.get(CACHE_KEY); if (cached && loadState(cached)) { S.ready = true; S.stale = true; }
  render();
  const [db, user] = await Promise.all([cl.use('db').catch(() => null), cl.use('user').catch(() => null)]);
  cl.use('downloads').then((d) => { B.downloads = d; }).catch(() => {});
  B.user = user;
  if (user) { let canEdit = true; try { canEdit = await user.canEdit(); } catch (e) { canEdit = true; } if (canEdit === false) { S.mode = 'private'; render(); return; } }
  if (db) { B.db = db; S.mode = 'db'; if (!S.ready) render(); updateSync(); subscribeDb(); }
  else { S.mode = 'local'; S.items = new Map(); S.students = new Map(); S.log = new Map(); loadState(LS.get(LOCAL_KEY)); S.ready = true; S.stale = false; render(); }
}
boot();
})();
