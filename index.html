/* ---------- buttons, chips, forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:13px;font:600 14px/1 var(--f-ui);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:transform .25s var(--spring),background .2s,border-color .2s,box-shadow .25s,color .2s;text-decoration:none;white-space:nowrap;cursor:pointer}

.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.fld{display:grid;gap:7px;min-width:0;align-content:start}
.fld>label,.flabel{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea,.fld select,.sel{width:100%;border-radius:13px;border:1px solid var(--line-2);background:var(--surface-2);padding:12px 14px;font-size:16px;line-height:1.4;transition:border-color .2s,box-shadow .2s,background .2s}
.fld textarea{resize:vertical;min-height:52px}
.fld input:focus,.fld textarea:focus,.fld select:focus,.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.fld textarea.serif{font:500 21px/1.3 var(--f-display)}
.fld-h{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.fld.err input,.fld.err textarea{border-color:var(--again);box-shadow:0 0 0 4px color-mix(in srgb,var(--again) 14%,transparent)}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}
.msg-bad{color:var(--again)}
.msg-ok{color:var(--good)}
.tgl{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;line-height:1.3}
.tgl input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;transition:background .25s;flex:none;margin:0;cursor:pointer}
.tgl input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .4s var(--spring)}
.tgl input:checked{background:var(--accent)}
.tgl input:checked::after{transform:translateX(18px)}
.tgl small{display:block;color:var(--muted);font-size:12px}
.range{width:100%;accent-color:var(--accent);height:28px}

/* ---------- dropdown ---------- */
.dd{position:relative;min-width:0}
.dd.open{z-index:40}
.lib-tools,.add-card,.dr{position:relative;z-index:5}
.dd-b{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border-radius:13px;border:1px solid var(--line-2);background:var(--surface-2);padding:11px 14px;font-size:16px;line-height:1.4;color:var(--ink);text-align:left;transition:border-color .2s,box-shadow .2s,background .2s}
.dd-b:hover{border-color:var(--ink-2)}
.dd-l{display:flex;align-items:center;gap:10px;min-width:0}
.dd-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-b>svg{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .4s var(--spring)}
.dd.open .dd-b{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.dd.open .dd-b>svg{transform:rotate(180deg);color:var(--accent-text)}
.dd-m{position:absolute;z-index:30;top:calc(100% + 8px);left:0;right:0;min-width:210px;max-height:290px;overflow:auto;overscroll-behavior:contain;padding:6px;border-radius:17px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);transform-origin:top center;animation:ddIn .32s var(--spring) both}
@keyframes ddIn{from{opacity:0;transform:translateY(-8px) scale(.96)}}
.dd-o{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:11px;font:500 14.5px/1.3 var(--f-ui);color:var(--ink);transition:background .15s;animation:rise .3s var(--ease) both;animation-delay:calc(min(var(--i),10)*25ms)}
.dd-o:hover,.dd-o:focus-visible{background:var(--bg-2);outline:none}
.dd-o .dd-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-o>svg{width:16px;height:16px;flex:none;color:var(--accent-text);opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--spring)}
.dd-o[aria-selected="true"]{font-weight:600}
.dd-o[aria-selected="true"]>svg{opacity:1;transform:none}
.dd .av,.dd .dd-me{width:26px;height:26px;font-size:11px}
.dd-me{display:grid;place-items:center;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-text)}
.dd-me svg{width:13px;height:13px}
.dd.sm .dd-b{height:38px;padding:0 12px;font-size:13px;border-radius:12px;background:var(--surface)}
.dd.sm .dd-m{left:auto;right:0}

/* ---------- covers ---------- */
.cover{position:relative;isolation:isolate;overflow:hidden;border-radius:26px;min-height:clamp(200px,24vw,260px);padding:clamp(20px,3vw,30px);display:flex;flex-direction:column;justify-content:flex-end;gap:6px;color:var(--stage-ink);background:var(--stage);margin-bottom:16px;animation:rise .7s var(--ease) both}
.cover-img{position:absolute;top:0;bottom:0;right:0;left:auto;height:100%;width:auto;max-width:100%;aspect-ratio:3/2;z-index:-2;background:center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%);mask-image:linear-gradient(90deg,transparent 0%,#000 28%);animation:kb 22s ease-in-out infinite alternate;transform-origin:60% 50%}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(95deg,rgba(17,15,31,.78) 0%,rgba(17,15,31,.35) 45%,rgba(17,15,31,0) 75%)}
.cover-bg{position:absolute;inset:-40px;z-index:-3;background:center/cover no-repeat;filter:blur(34px) saturate(1.15);opacity:.8}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.035)}}
.cover h2{margin:0;font:italic 600 clamp(34px,5vw,48px)/1 var(--f-display);letter-spacing:-.01em}
.cover p{margin:0;font:500 12px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--stage-muted);text-transform:uppercase}
.cover .btn{align-self:flex-start;margin-top:10px;background:var(--stage-ink);color:var(--stage);border-color:transparent}
.cover.tall{min-height:clamp(240px,30vw,300px)}
@media (max-width:640px){
  .cover,.cover.tall{min-height:0;aspect-ratio:3/2}
  .cover-img{inset:0;width:100%;height:100%;aspect-ratio:auto;-webkit-mask-image:none;mask-image:none}
  .cover-bg{display:none}
  .cover::before{background:linear-gradient(0deg,rgba(17,15,31,.86) 0%,rgba(17,15,31,.35) 45%,rgba(17,15,31,0) 70%)}
}
.stage.moon::before{background:linear-gradient(100deg,rgba(17,15,31,.86) 0%,rgba(17,15,31,.55) 42%,rgba(17,15,31,.1) 72%),var(--moon) 70% 50%/cover no-repeat,var(--stage)}
.stage.moon .stage-mix,.stage.moon .stage-legend{color:var(--stage-ink);text-shadow:0 1px 14px rgba(10,8,22,.9)}
.stage.moon .stage-legend{opacity:.7}
@media (max-width:600px){.stage.moon::before{background:linear-gradient(180deg,rgba(17,15,31,.5) 0%,rgba(17,15,31,.62) 40%,rgba(17,15,31,.82) 75%,rgba(17,15,31,.9) 100%),var(--moon) 57% 50%/cover no-repeat,var(--stage)}}

/* ---------- library ---------- */
.lib-tools{display:grid;gap:12px;margin-bottom:18px}
.search{position:relative;display:block}
.search svg{position:absolute;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{-webkit-appearance:none;appearance:none;width:100%;height:50px;padding:0 16px 0 44px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);font-size:16px;transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lib-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.lib-row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sel{width:auto;height:38px;padding:0 12px;font-size:13px;border-radius:12px;background:var(--surface)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.it{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .4s var(--spring),border-color .25s,box-shadow .4s;animation:rise .6s var(--ease) both;animation-delay:calc(min(var(--i),14)*35ms);min-width:0;width:100%}

.it-top .due.now{color:var(--glow)}
.it-q{margin:0;font:500 22px/1.22 var(--f-display);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty;overflow-wrap:break-word}
.it-pt{font:italic 600 24px/1.15 var(--f-display)}
.it-pl{margin:-4px 0 0;font:500 18px/1.3 var(--f-display);color:var(--ink-2);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-w{font:700 23px/1.15 var(--f-ui);letter-spacing:-.015em;overflow-wrap:anywhere}
.it-m{color:var(--ink-2);font-size:14px;margin-top:-6px;overflow-wrap:anywhere}
.it-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;font:500 11px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.it-foot>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lad{display:inline-flex;gap:2px;flex:none}
.lad i{width:4px;height:12px;border-radius:2px;background:var(--line-2)}
.lad i.on{background:var(--accent)}
.lad.m i.on{background:var(--good)}
.pdots{display:inline-flex;gap:4px;flex:none}
.pdots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.pdots i.on{background:var(--accent)}
.pdots i.m{background:var(--good)}
.empty{padding:44px 22px;text-align:center;border:1.5px dashed var(--line-2);border-radius:24px;color:var(--ink-2)}
.empty h3{font:italic 600 32px/1.1 var(--f-display);margin:0 0 8px;color:var(--ink)}
.empty p{margin:0 auto 18px;max-width:44ch}
.empty.sm{padding:28px 18px}
.empty.sm h3{font-size:26px}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fade .3s both;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{position:relative;width:100%;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:sheetUp .55s var(--ease) both}
.sheet-grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 10px}
.sheet-x{position:sticky;top:0;float:right;z-index:2;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--bg-2);color:var(--ink-2);margin:0 0 6px 10px}
.sheet-x svg{width:18px;height:18px}
.sheet-wrap.out{animation:fade .28s reverse both}
.sheet-wrap.out .sheet{animation:sheetDown .3s var(--ease) both}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.2}}
@keyframes sheetDown{to{transform:translateY(60px);opacity:0}}
@media (min-width:760px){
  .sheet-wrap{align-items:center;padding:28px}
  .sheet{max-width:700px;max-height:90vh;border-radius:28px;padding:28px 32px 32px}
  .sheet-grab{display:none}
}
.sh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 12.5px/1 var(--f-ui);color:var(--muted);margin:6px 0 18px}
.sh-q{margin:0;font:500 clamp(26px,4.4vw,36px)/1.18 var(--f-display);text-wrap:pretty;overflow-wrap:break-word}
.sh-by{margin-top:12px;font:500 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-tr{margin:14px 0 0;color:var(--ink-2)}
.sh-note{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:14px;color:var(--ink-2)}
.sh-note b{color:var(--ink);font-weight:600}
.sh-sec{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.sh-sec .flabel{display:block;margin-bottom:12px}
.sh-w{font:700 clamp(32px,6vw,46px)/1.05 var(--f-ui);letter-spacing:-.02em;overflow-wrap:anywhere}
.sh-mean{margin-top:8px;font:500 20px/1.3 var(--f-ui);color:var(--ink-2)}
.sh-ex{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--surface-2);font:500 20px/1.35 var(--f-display)}
.sh-ex span{display:block;margin-top:4px;font:400 14px/1.4 var(--f-ui);color:var(--muted)}
.sh-poem{display:grid;gap:18px}
.sh-st{font:500 21px/1.38 var(--f-display);white-space:pre-line}
.sh-st small{display:block;margin-top:6px;font:400 13.5px/1.45 var(--f-ui);color:var(--muted);white-space:normal}
.tr-out{margin-top:14px;display:grid;gap:16px;font:500 22px/1.42 var(--f-display)}
.tr-out p{margin:0}
.fw{display:inline-block;vertical-align:baseline;padding:0 1px;border-radius:5px;color:var(--accent-text)}
.fw i,.fl-w i{display:inline-block;width:calc(var(--n)*.42em);height:.1em;border-bottom:2px dotted currentColor;margin-left:1px}
.fw:hover{background:var(--accent-soft)}
.fl-w{white-space:nowrap}
.units{display:grid;gap:14px}
.unit-h{display:flex;justify-content:space-between;gap:10px;font:500 12px/1.2 var(--f-mono);color:var(--ink-2);letter-spacing:.04em}
.unit-h span:last-child{color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:8px}
.track i{height:8px;border-radius:3px;background:var(--bg-2)}
.track i.on{background:color-mix(in srgb,var(--accent) 55%,var(--bg-2))}
.track i.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.track.m i.on,.track.m i.cur{background:var(--good);box-shadow:none}
.track-l{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font:500 9px/1 var(--f-mono);color:var(--muted);text-align:center;margin-bottom:2px}
.sh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.sh-stats div{padding:12px;border-radius:14px;background:var(--surface-2)}
.sh-stats b{display:block;font:600 24px/1 var(--f-display);font-variant-numeric:lining-nums}
.sh-stats span{font:500 10px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-acts{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}

/* ---------- add ---------- */
.add-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.add-grid{grid-template-columns:1fr}}
.add-card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,28px)}
.pv{position:sticky;top:24px;display:grid;gap:10px;min-width:0}
.pv-stage{position:relative;overflow:hidden;isolation:isolate;background:var(--stage);color:var(--stage-ink);border-radius:26px;padding:26px;min-height:280px}
.pv-stage::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(17,15,31,.45),rgba(17,15,31,.45)),var(--stage-img) 70% 30%/cover no-repeat}
.pv-stage .lang{--lc:var(--sky-xx)}.pv-stage .lang.l-fr{--lc:var(--sky-fr)}.pv-stage .lang.l-it{--lc:var(--sky-it)}.pv-stage .lang.l-en{--lc:var(--sky-en)}.pv-stage .lang.l-ru{--lc:var(--sky-ru)}
.pv-meta{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stage-muted);margin-bottom:18px}
.pv-sit{margin:0;font:500 19px/1.35 var(--f-ui)}
.pv-key{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--stage-2);font:italic 500 17px/1 var(--f-display)}
.pv-key i{font:500 9.5px/1 var(--f-mono);font-style:normal;letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;border-radius:99px;background:var(--stage-3);color:var(--stage-muted)}
.pv-div{display:flex;align-items:center;gap:10px;margin:20px 0 16px;font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--stage-muted)}
.pv-div::before,.pv-div::after{content:"";flex:1;height:1px;background:var(--stage-line)}
.pv-q{margin:0;font:500 26px/1.2 var(--f-display);overflow-wrap:break-word}
.pv-by{margin-top:10px;font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stage-muted)}
.pv-tr{margin:12px 0 0;color:var(--stage-muted);font-size:14px}
.pv-pt{font:italic 600 26px/1.15 var(--f-display);margin-bottom:14px}
.pv-st{display:grid;grid-template-columns:22px 1fr;gap:10px;margin-bottom:12px}
.pv-st p{margin:0;font:500 19px/1.35 var(--f-display)}
.pv-sn{font:500 11px/1.8 var(--f-mono);color:var(--stage-muted)}
.pv-more{margin:8px 0 0;font:500 11.5px/1 var(--f-mono);color:var(--stage-muted)}
.pv-w{font:700 36px/1.05 var(--f-ui);letter-spacing:-.02em;overflow-wrap:anywhere}
.pv-pron{margin-top:8px;font:400 14px/1.3 var(--f-mono);color:var(--stage-muted)}
.pv-mean{font:600 24px/1.2 var(--f-ui)}
.pv-ex{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--stage-2);font:500 18px/1.3 var(--f-display)}
.pv-ex span{display:block;margin-top:4px;font:400 13px/1.4 var(--f-ui);color:var(--stage-muted)}
.pv-list{display:grid;gap:2px}
.pv-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--stage-line);animation:rise .4s var(--ease) both}
.pv-row b{font-weight:700;overflow-wrap:anywhere}
.pv-row span{color:var(--stage-muted);overflow-wrap:anywhere}
.pv-note{margin:0;font:500 12px/1.4 var(--f-mono);color:var(--muted);min-height:1.4em}

/* ---------- students ---------- */
.stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.stu{display:grid;gap:16px;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:transform .4s var(--spring),border-color .25s,box-shadow .4s;animation:rise .6s var(--ease) both;animation-delay:calc(min(var(--i),12)*45ms)}

.stu-h{display:flex;align-items:center;gap:12px;min-width:0}

.stu-n{font:600 18px/1.2 var(--f-ui);overflow-wrap:anywhere}
.stu-s{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{padding:10px 12px;border-radius:14px;background:var(--surface-2);min-width:0}
.kv b{display:block;font:600 26px/1 var(--f-display);font-variant-numeric:lining-nums}
.kv span{font:500 9.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stu-foot{display:flex;justify-content:space-between;gap:10px;font:500 11.5px/1.2 var(--f-mono);color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--f-ui);color:var(--muted);text-decoration:none;margin-bottom:12px;padding:6px 0}
.back svg{width:16px;height:16px}
.back:hover{color:var(--ink)}
.st-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.st-hero .av{width:66px;height:66px;font-size:26px}
.st-hero h1{margin:0}
.st-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.dr>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 15px/1.25 var(--f-ui)}
.dr>summary::-webkit-details-marker{display:none}
.dr>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .35s var(--spring)}

.jp .jp-tile h3{font:600 18px var(--f-ui);margin:0 0 6px}.jp .jp-tile p{font-size:13px;color:#6a806f;margin:0}
.jp .jp-progress{height:6px;background:#e3ece1;border-radius:99px;overflow:hidden;margin-top:15px}.jp .jp-progress i{display:block;height:100%;background:#579768;border-radius:99px}
.jp .jp-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:13px;border:1px solid #bdd7bf;padding:12px 18px;background:#fffefa;color:#285d41;font-weight:650;cursor:pointer;text-align:center}
.jp .jp-btn.primary{background:#347452;color:#fff;border-color:#347452}.jp .jp-btn:disabled{opacity:.45}
.jp .jp-btn.soft{background:#e9f2e7}.jp .jp-btn.bad{background:#fff1e7;border-color:#f1c5ac;color:#985332}
.jp .jp-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.jp .jp-panel{padding:24px;margin-top:17px}
.jp .jp-sub{color:#668070;font-size:14px}
.jp .jp-kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:9px;margin-top:16px}
.jp .jp-character{background:#f1f7ee;border:1px solid #dfecdd;padding:10px 4px;border-radius:12px;cursor:pointer;text-align:center;min-height:84px;position:relative}
.jp .jp-character b{font:38px/1.2 serif;display:block}.jp .jp-character small{font-size:12px;color:#55775b}
.jp .jp-character.done:after{content:'✓';position:absolute;right:6px;top:4px;font-size:11px;color:#3d9154}
.jp .jp-character:hover{background:#e2efe0}
.jp .jp-study{max-width:590px;margin:20px auto;background:#fffefa;padding:30px;border-radius:27px;border:1px solid #d9e6d7;text-align:center;box-shadow:0 18px 45px #31533915}
.jp .jp-study .huge{font:clamp(92px,18vw,160px)/1.25 serif;color:#2e5e43;margin:25px 0 7px}
.jp .jp-study .jp-question{color:#6b8675;margin:0;font-size:14px}
.jp .jp-study .jp-answer{font-size:26px;font-weight:700;margin-top:12px;color:#234f37}
.jp .jp-study .jp-meaning{color:#64826b;margin:7px 0}
.jp .jp-input,.jp textarea,.jp select{display:block;width:100%;padding:13px 15px;border:1px solid #c7dac8;background:#fff;border-radius:12px;color:#254432;font:inherit;margin:6px 0 16px;box-shadow:inset 0 1px 0 #ffffff,0 10px 24px #3153390a}
.jp label{font-size:13px;font-weight:700;color:#456651;letter-spacing:.01em}.jp .jp-field{margin:10px 0}.jp .jp-gridform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.jp .jp-gridform .wide{grid-column:1/-1}.jp .jp-field .dd.jp-dd{margin:6px 0 16px}.jp .jp-field .dd.jp-dd .dd-b{width:100%;min-height:56px;border-radius:16px;border:1px solid #abc7ad;background:linear-gradient(180deg,#fffefb,#f2f7ef);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 24px #31533912, inset 0 1px 0 rgba(255,255,255,.95);color:#234a33}.jp .jp-field .dd.jp-dd.open .dd-b,.jp .jp-field .dd.jp-dd .dd-b:focus{border-color:#357451;box-shadow:0 0 0 4px rgba(53,116,81,.14),0 14px 30px #31533914}.jp .jp-field .dd.jp-dd .dd-l{display:flex;align-items:center;gap:12px;font-weight:700}.jp .jp-field .dd.jp-dd .dd-v{font-size:17px;letter-spacing:-.01em}.jp .jp-field .dd.jp-dd .dd-me{display:grid;place-items:center;min-width:30px;height:30px;padding:0 10px;border-radius:999px;background:linear-gradient(180deg,#e7f2e4,#d8ead5);color:#2a5e43;font:700 11px/1 var(--f-mono);box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}.jp .jp-field .dd.jp-dd .dd-m{top:calc(100% + 8px);border-radius:18px;border:1px solid #bfd4bf;background:rgba(255,254,250,.98);box-shadow:0 20px 38px #274e3517;backdrop-filter:blur(12px);padding:8px}.jp .jp-field .dd.jp-dd .dd-o{border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;color:#2b4f39}.jp .jp-field .dd.jp-dd .dd-o:hover,.jp .jp-field .dd.jp-dd .dd-o:focus{background:#edf5e9}.jp .jp-field .dd.jp-dd .dd-o[aria-selected="true"]{background:linear-gradient(90deg,#e1f0df,#eef6ea);color:#234b34}.jp .jp-field .dd.jp-dd .dd-o .dd-t{font-weight:650}.jp .jp-note{margin:-2px 0 18px;color:#708670;font-size:12px}@media(max-width:740px){.jp .jp-gridform{grid-template-columns:1fr}}
body.japanese-mode .panel,body.japanese-mode .jp .jp-panel,body.japanese-mode .jp .jp-tile{background:linear-gradient(180deg,rgba(255,255,252,.94),rgba(248,251,245,.96));border:1px solid rgba(76,115,80,.17);box-shadow:0 18px 42px rgba(36,80,52,.08)}body.japanese-mode .panel{backdrop-filter:blur(10px)}body.japanese-mode .vtitle{color:#204632;text-shadow:0 1px 0 rgba(255,255,255,.75)}body.japanese-mode .main{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0));border-radius:0}
.jp .jp-bottom{position:fixed;z-index:40;bottom:max(14px,env(safe-area-inset-bottom,14px));left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#fafff6ed;backdrop-filter:blur(18px);border:1px solid #cfe2ca;box-shadow:0 14px 36px #24503726;padding:7px;border-radius:18px;max-width:calc(100vw - 26px)}
.jp .jp-bottom button{border-radius:12px;padding:10px 17px;font-size:13px;color:#567460;white-space:nowrap;cursor:pointer}
.jp .jp-bottom button.active{background:#347452;color:#fff}
.jp .jp-bottom button{flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis}
.jp .jp-bottom{width:min(520px,calc(100vw - 22px))}
.jp .jp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.jp .jp-item{padding:13px 0;border-bottom:1px solid #e2ebdf;display:flex;justify-content:space-between;align-items:center;gap:12px}.jp .jp-item:last-child{border:0}
.jp .jp-pill{padding:5px 10px;border-radius:999px;background:#e5f0e2;color:#477354;font-size:11px;font-weight:700}
.jp .jp-empty{padding:28px;text-align:center;color:#6e866e}
@media(max-width:650px){.jp .jp-grid{grid-template-columns:1fr}.jp .jp-hero{padding:27px 24px}.jp .jp-tile{padding:18px}.jp .jp-bottom button{padding:10px 11px;font-size:12px}.jp .jp-panel{padding:17px}.jp .jp-study{padding:22px 16px}}

  const first = fut.reduce((a, u) => (u.s.d < a.s.d ? u : a)); let n, when;
  if (first.s.l < 2) { n = fut.filter((u) => u.s.d <= first.s.d + 30 * MIN).length; when = 'сегодня в ' + hm(first.s.d); }
  else {
    const k = todayKey(first.s.d); n = fut.filter((u) => todayKey(u.s.d) === k).length; const d = new Date(first.s.d); const dd = calDiff(first.s.d, now);
    when = dd <= 0 ? 'сегодня' : (dd === 1 ? 'завтра, ' : dd === 2 ? 'послезавтра, ' : '') + WD[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    if (cut()) when += dd <= 0 ? ' в ' + hm(first.s.d) : ' с ' + hm(first.s.d);
  }
  return { when, n };
}
function nextHTML(units, after) {

}

function heatPanel(logMap, cls = 'p-heat') {
  const weeks = 18; const today = lday(Date.now()); const tk = dkey(today);
  const start = new Date(today); start.setDate(start.getDate() - ((today.getDay() + 6) % 7) - (weeks - 1) * 7);

    if (cd.getMonth() !== lastM) { if (w - lastCol >= 3 || lastCol < 0) { months += `<span style="left:${w * 15}px">${MON_S[cd.getMonth()]}</span>`; lastCol = w; } lastM = cd.getMonth(); }
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(start.getDate() + w * 7 + d); const k = dkey(day);
      if (day > today) { cells += '<i class="fut"></i>'; continue; }
      const n = (logMap.get(k) && logMap.get(k).n) || 0; total += n; if (n) active++;

}
function forecastPanel(units, freshN) {

}

}

}

async function boot() {
  buildShell();
  if (STUDENT) { initStudent(); render(); if (tgCfg() && LS.get(PEND_KEY)) setTimeout(() => tgSend(null), 1500); return; }
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { S.mode = 'local'; loadState(LS.get(LOCAL_KEY)); S.ready = true; render(); initFirebaseSync(); return; }
  S.mode = 'boot';
  const cached = LS.get(CACHE_KEY); if (cached && loadState(cached)) { S.ready = true; S.stale = true; }
  render();
  const [db, user] = await Promise.all([cl.use('db').catch(() => null), cl.use('user').catch(() => null)]);
  cl.use('downloads').then((d) => { B.downloads = d; }).catch(() => {});
  B.user = user;
  if (user) { let canEdit = true; try { canEdit = await user.canEdit(); } catch (e) { canEdit = true; } if (canEdit === false) { S.mode = 'private'; render(); return; } }
  if (db) { B.db = db; S.mode = 'db'; if (!S.ready) render(); updateSync(); subscribeDb(); }
  else { S.mode = 'local'; S.items = new Map(); S.students = new Map(); S.log = new Map(); loadState(LS.get(LOCAL_KEY)); S.ready = true; S.stale = false; render(); }
}

const JP_BY_ID = new Map(JP_CARDS.map(x => [x.id,x]));
const JP = { tab:'today', section:'hira', card:null, revealed:false, queue:[], at:0, progress:{}, ready:false, editing:false, extraLang:false, lastUid:null };
function jpGreeting() { return greeting() + ', Лера'; }
function jpState(id) { if(id.startsWith('w') && /[fr]$/.test(id)){const it=S.items.get(id.slice(1,-1));return it&&it.srs&&it.srs[id.slice(-1)]||null;}return JP.progress[id] || null; }
function jpFresh(list) { return list.filter(x=>!jpState(x.id)); }
function jpDue(list) { const t=Date.now();return list.filter(x=>jpState(x.id) && jpState(x.id).d<=t).sort((a,b)=>jpState(a.id).d-jpState(b.id).d); }
function jpSaved(list) { return list.filter(x=>jpState(x.id)); }
function jpItems(section) { if(section==='all')return JP_CARDS;return JP_CARDS.filter(x=>x.kind===section); }
function jpWords() {return [...S.items.values()].filter(x=>ownerOf(x)==='me' && (x.type==='word'||x.type==='phrase') && (x.lang==='ja'||(JP.extraLang&&x.lang!=='ja')));}
function jpFooter() { return `<div class="jp-bottom" role="navigation" aria-label="Разделы">${[['today','✧','Сегодня'],['collection','▣','Коллекция'],['add','+','Добавить'],['settings','☷','Настройки']].map(([x,ic,y])=>`<button data-j="tab" data-v="${x}" class="${(JP.tab===x||(x==='collection'&&['study','words'].includes(JP.tab)))?'active':''}"><span class="jp-nav-icon">${ic}</span><span>${y}</span></button>`).join('')}</div>`; }
function jpCardCount(kind) {let a=jpItems(kind);return `${jpSaved(a).length} / ${a.length}`;}
function jpCard(kind) {let arr=jpItems(kind);let done=jpSaved(arr).length;return `<button class="jp-tile" data-j="section" data-v="${kind}"><span class="jp-glyph">${kind==='hira'?'あ':kind==='kata'?'ア':'森'}</span><h3>${kind==='hira'?'Хирагана':kind==='kata'?'Катакана':'Кандзи'}</h3><p>${kind==='kanji'?'80 начальных иероглифов':'Основные, озвончённые и составные знаки'}</p><div class="jp-progress"><i style="width:${(100*done/(arr.length||1)).toFixed(1)}%"></i></div><p style="margin-top:10px">${done} из ${arr.length} изучено</p></button>`; }
function jpHome() {let all=JP_CARDS, learned=jpSaved(all).length,due=jpDue(all).length, w=jpWords();return `<div class="jp-hero"><div class="jp-eyebrow">ENCORE · ТВОЙ ЯПОНСКИЙ САД</div><h1>${jpGreeting()} 🌿</h1><p>Каждый новый знак — маленький росток. Занимайся в своём ритме, а Encore сохранит твой путь.</p><div class="jp-stats"><div class="jp-stat"><strong>${learned}</strong><span>знаков изучено</span></div><div class="jp-stat"><strong>${due}</strong><span>повторить сейчас</span></div><div class="jp-stat"><strong>${w.length}</strong><span>твоих слов и фраз</span></div></div></div><div class="jp-row"><h2>Твой путь в японском</h2><span class="jp-pill">日本語 · Japanese</span></div><div class="jp-grid">${jpCard('hira')}${jpCard('kata')}${jpCard('kanji')}</div><div class="jp-panel"><div class="jp-row"><div><h3 style="margin:0 0 5px;font:600 20px var(--f-ui)">Продолжить обучение</h3><div class="jp-sub">Сегодня доступны ${due} повторений. Новые знаки добавляются постепенно.</div></div><button class="jp-btn primary" data-j="start" data-v="all">Начать занятие →</button></div></div>`; }
function jpCollection() {return `<div class="jp-eyebrow">ТВОЯ БИБЛИОТЕКА</div><h2>Коллекция</h2><div class="jp-grid">${jpCard('hira')}${jpCard('kata')}${jpCard('kanji')}</div><div class="jp-panel"><div class="jp-row"><div><h3>Слова и фразы</h3><p class="jp-sub">${jpWords().length} добавлено</p></div><button class="jp-btn primary" data-j="tab" data-v="words">Открыть коллекцию →</button></div></div>`;}
function jpBrowse() {const kind=JP.section,items=jpItems(kind);return `<div class="jp-row"><div><div class="jp-eyebrow">ВСТРОЕННАЯ БИБЛИОТЕКА</div><h2 style="margin:5px 0">${kind==='hira'?'Хирагана':kind==='kata'?'Катакана':'Кандзи'}</h2><div class="jp-sub">${items.length} знаков · ${jpSaved(items).length} уже изучено</div></div><button class="jp-btn primary" data-j="start" data-v="${kind}">Учить / повторить →</button></div><div class="jp-actions">${[['hira','ひらがな'],['kata','カタカナ'],['kanji','漢字']].map(([k,t])=>`<button class="jp-btn ${kind===k?'primary':''}" data-j="section" data-v="${k}">${t}</button>`).join('')}</div><div class="jp-panel"><div class="jp-kana-grid">${items.map(x=>`<button data-j="single" data-v="${x.id}" class="jp-character ${jpState(x.id)?'done':''}"><b>${x.glyph}</b><small>${x.kind==='kanji'?esc(x.meaning):x.rom}</small></button>`).join('')}</div></div>`; }
function jpStart(kind,one) {const list=one?[JP_BY_ID.get(one)]:kind==='words'?jpWords().flatMap(it=>[{id:'w'+it.id+'f',kind:'custom',it,k:'f',glyph:it.text,rom:it.translation,label:'Слово / фраза'},{id:'w'+it.id+'r',kind:'custom',it,k:'r',glyph:it.translation,rom:it.text,label:'Обратный перевод'}]):jpItems(kind);const due=jpDue(list);const fresh=jpFresh(list).slice(0,Math.max(0,S.settings.newPerDay||15));JP.queue=[...due,...fresh].filter(Boolean);if(!JP.queue.length) {toast('Все карточки повторены! Вернись позже 🌿');return;} JP.at=0;JP.revealed=false;JP.tab='review';jpRender();}
function jpReview() {const x=JP.queue[JP.at];if(!x)return `<div class="jp-panel"><h2>Прекрасно, Лера! 🌱</h2><p>Занятие завершено. Прогресс сохранён в Firebase.</p><button class="jp-btn primary" data-j="tab" data-v="today">На главную</button></div>`;let state=jpState(x.id);return `<div class="jp-row"><span class="jp-eyebrow">ПОВТОРЕНИЕ · ${JP.at+1} / ${JP.queue.length}</span><button data-j="close" class="jp-btn">Закончить</button></div><div class="jp-study"><div class="jp-eyebrow">${x.label} · ${state?'повторение':'новый знак'}</div><p class="jp-question">${x.kind==='kanji'?'Что означает знак и как он читается?':'Как читается этот знак?'}</p><div class="huge">${x.glyph}</div>${JP.revealed?`<div class="jp-answer">${x.kind==='kanji'?esc(x.meaning):x.rom}</div>${x.kind==='kanji'?`<div class="jp-meaning">Чтения: ${esc(x.rom)}</div><div class="jp-meaning">${esc(x.example)}</div>`:''}<div class="jp-actions" style="justify-content:center"><button class="jp-btn bad" data-j="grade" data-v="0">Забыла</button><button class="jp-btn" data-j="grade" data-v="1">Трудно</button><button class="jp-btn primary" data-j="grade" data-v="2">Помню</button><button class="jp-btn soft" data-j="grade" data-v="3">Легко</button></div>`:`<button class="jp-btn primary" data-j="reveal" style="margin-top:20px">Показать ответ</button>`}</div>`; }
function jpGrade(g) {const c=JP.queue[JP.at];if(!c||!JP.revealed)return;const prev=jpState(c.id),next=nextState(prev,g,Date.now());JP.progress[c.id]=next;const uid=signedUser&&signedUser.uid;if(c.kind==='custom'){const it=S.items.get(c.it.id);if(it){it.srs={...(it.srs||{}),[c.k]:next};persist('items',it.id,()=>B.db.collection('items').doc(it.id).update({['srs.'+c.k]:next}));}}else if(uid===JP_UID&&B.db) {const data={};data.entries={[c.id]:next};enqueue('japaneseProgress/progress',()=>B.db.collection('japaneseProgress').doc('progress').set(data,{merge:true}));}JP.at++;JP.revealed=false;jpRender();}
function jpWordView() {const words=jpWords();return `<div class="jp-row"><div><div class="jp-eyebrow">ЛИЧНАЯ КОЛЛЕКЦИЯ</div><h2 style="margin:5px 0">Слова и фразы</h2></div><div class="jp-actions"><button class="jp-btn" data-j="start" data-v="words">Повторить слова</button><button class="jp-btn primary" data-j="tab" data-v="add">+ Добавить</button></div></div><div class="jp-panel">${words.length?words.map(w=>`<div class="jp-item"><div><b style="font-size:19px">${esc(w.text||'')}</b><div class="jp-sub">${esc(w.translation||'')} · ${w.type==='phrase'?'Фраза':'Слово'}</div></div><button class="jp-btn" data-j="delete" data-v="${esc(w.id)}">Удалить</button></div>`).join(''):'<div class="jp-empty">Пока пусто. Добавь своё первое японское слово 🌱</div>'}</div>`; }
function jpAddView() { const typeOpts=[['word','Слово','<span class=\"dd-me\">単語</span>'],['phrase','Фраза','<span class=\"dd-me\">句</span>']]; const langOpts=[['ja','Японский','<span class=\"dd-me\">日本語</span>']].concat(JP.extraLang?[['fr','Французский','<span class=\"dd-me\">FR</span>'],['it','Итальянский','<span class=\"dd-me\">IT</span>'],['en','Английский','<span class=\"dd-me\">EN</span>']]:[]); return `<div class=\"jp-eyebrow\">СВОЯ КОЛЛЕКЦИЯ</div><h2>Посадить новое слово 🌱</h2><form class=\"jp-panel\" id=\"jp-form\"><div class=\"jp-gridform\"><div class=\"jp-field\"><label>Тип карточки</label>${ddHTML('jp-type-dd',typeOpts,'word','jp-dd','Тип карточки')}<input type=\"hidden\" name=\"type\" value=\"word\"></div><div class=\"jp-field\"><label>Язык</label>${ddHTML('jp-lang-dd',langOpts,'ja','jp-dd','Язык')}<input type=\"hidden\" name=\"lang\" value=\"ja\"></div><div class=\"jp-field wide\"><label>Слово или фраза</label><input class=\"jp-input\" name=\"text\" placeholder=\"例: こんにちは\" required maxlength=\"250\"></div><div class=\"jp-field wide\"><label>Перевод на русский</label><input class=\"jp-input\" name=\"translation\" placeholder=\"Например: здравствуйте\" required maxlength=\"400\"></div><div class=\"jp-field wide\"><label>Пример (необязательно)</label><textarea name=\"example\" rows=\"3\" placeholder=\"Пример использования\"></textarea><div class=\"jp-note\">Эта карточка сохранится в личной коллекции Леры и будет участвовать в повторениях.</div></div></div><button class=\"jp-btn primary\" type=\"submit\">Сохранить в Firebase</button></form>`; }
function jpSettings() {
const s=S.settings;
return `<header class="vhead"><h1 class="vtitle">Настройки</h1></header><div class="jp-settings-stack">
${cloudPanelHtml()}
<section class="panel"><div class="ph"><h2>Интенсивность повторений</h2></div><div class="int-grid">${Object.entries(INT).map(([key,v])=>`<button class="int" data-act="int" data-k="${key}" aria-pressed="${s.intensity===key}"><b>${v.name}</b><p>${v.note}</p><div class="steps">${Array.from({length:10},(_,i)=>`<span>${ladderLabel(i+1,v.k)}</span>`).join('')}</div></button>`).join('')}</div><p class="fld-h" style="margin-top:12px">Меняет интервалы следующих повторений. Уже назначенные даты остаются.</p></section>
<section class="panel"><div class="ph"><h2>Новый день начинается</h2></div>${segHTML('dh',[['4','в 4:00'],['0','в полночь']],String(s.dayHour==null?4:s.dayHour))}<p class="fld-h" style="margin-top:12px">Повторения после полуночи могут относиться к предыдущему учебному дню.</p></section>
<section class="panel"><div class="ph"><h2>Новых карточек в день</h2><b class="mono" id="np-v">${s.newPerDay}</b></div><input type="range" class="range" id="np" min="5" max="60" step="5" value="${s.newPerDay}" aria-label="Новых карточек в день"><p class="fld-h">Лимит новых японских знаков и слов на день.</p></section>
<section class="panel"><div class="ph"><h2>Как работают повторения</h2></div><div class="howgrid"><div class="how h0"><b>Забыла</b><p>Повторение сначала.</p></div><div class="how h1"><b>Трудно</b><p>Интервал короче.</p></div><div class="how h2"><b>Помню</b><p>Следующий шаг.</p></div><div class="how h3"><b>Легко</b><p>Пропуск шага.</p></div></div></section>
<section class="panel"><div class="ph"><h2>Языки</h2></div><p>Основной язык — японский 🇯🇵. Хирагана, катакана и первые 80 кандзи уже встроены в сайт.</p><label class="jp-extra-settings"><input type="checkbox" id="jp-lang" ${JP.extraLang?'checked':''}><span>Показывать французский, итальянский и английский при добавлении слов</span></label></section>
<section class="panel"><div class="ph"><h2>Хранение</h2><span class="sync ${S.mode==='db'?'cloud':''}"><i></i>${S.mode==='db'?'Облако':'Этот браузер'}</span></div><p>Карточки, настройки и прогресс сохраняются в Firebase. Встроенная японская библиотека уже находится в файлах сайта.</p><div class="acts"><button class="btn" data-act="backup">${I.down}<span>Скачать копию</span></button></div></section>
<p class="credit">Encore · created by Stas Vinnikov</p></div>`;
}
function jpRender() {const main=$('#main');if(!main)return;document.body.classList.add('japanese-mode');document.documentElement.classList.add('japanese-mode');stopSky();const view=JP.tab==='review'?jpReview():JP.tab==='today'?jpHome():JP.tab==='collection'?jpCollection():JP.tab==='study'?jpBrowse():JP.tab==='words'?jpWordView():JP.tab==='add'?jpAddView():jpSettings();updateNav(JP.tab==='settings'?'prefs':(['collection','study','words'].includes(JP.tab)?'library':JP.tab));main.innerHTML=`<div class="jp">${view}</div>`;
if(JP.tab==='settings'){
 bindSeg(main,'dh',v=>{S.settings={...S.settings,dayHour:+v};putSettings();toast(+v?'Новый день начинается в 4:00':'Новый день начинается в полночь');});
 const np=$('#np',main);if(np){np.addEventListener('input',()=>{$('#np-v',main).textContent=np.value;});np.addEventListener('change',()=>{S.settings={...S.settings,newPerDay:+np.value};putSettings();sfx('save');});}
}
if(JP.tab==='add'){
 const f=$('#jp-form',main);
 bindDD(main,'jp-type-dd',v=>{ const i=f&&f.querySelector('input[name=\"type\"]'); if(i) i.value=v; sfx('tap'); });
 bindDD(main,'jp-lang-dd',v=>{ const i=f&&f.querySelector('input[name=\"lang\"]'); if(i) i.value=v; sfx('tap'); });
}
CUR={V:{live:false,refresh:()=>{if(!document.querySelector('.jp input:focus,.jp textarea:focus'))jpRender();}},el:main,r:{v:'japanese'}}; }
function jpInitProgress() {JP.progress={};JP.ready=false;JP.tab='today';JP.at=0;JP.queue=[];if(!jpProfile())return;let expected=signedUser.uid;const unsub=B.db.collection('japaneseProgress').doc('progress').onSnapshot(d=>{if(!signedUser||signedUser.uid!==expected)return;JP.progress=d.exists?(d.data().entries||{}):{};JP.extraLang=d.exists?!!d.data().extraLang:false;JP.ready=true;if(JP.tab!=='review')jpRender();},e=>{console.warn('Japanese progress sync',e);toast('Не удалось загрузить прогресс японского','bad');});cloudListeners.push(unsub);}
document.addEventListener('click',function(e){if(!jpProfile())return;const a=e.target.closest('.nav .nl,.nav .brand,.mtop .brand');if(!a)return;e.preventDefault();e.stopImmediatePropagation();sfx('tick');const t=a.dataset.nav||'today';JP.tab=t==='prefs'?'settings':t==='library'?'collection':t==='add'?'add':'today';jpRender();window.scrollTo(0,0);},true);
document.addEventListener('click',e=>{if(!jpProfile())return;const b=e.target.closest('[data-j]');if(!b)return; e.preventDefault();const cmd=b.dataset.j,v=b.dataset.v||'';if(cmd==='tab'||cmd==='section'||cmd==='single'||cmd==='start')sfx('tick');else if(cmd==='reveal')sfx('reveal');else if(cmd==='grade')sfx('g'+v);else if(cmd==='close')sfx('close');if(cmd==='tab'){JP.tab=v;jpRender();window.scrollTo(0,0);}else if(cmd==='section'){JP.section=v;JP.tab='study';jpRender();}else if(cmd==='single')jpStart('all',v);else if(cmd==='start')jpStart(v);else if(cmd==='reveal'){JP.revealed=true;jpRender();}else if(cmd==='grade')jpGrade(+v);else if(cmd==='close'){JP.tab='today';jpRender();}else if(cmd==='delete'){if(confirm('Удалить эту карточку?'))del('items',v).then(()=>jpRender());} });
document.addEventListener('change',e=>{if(jpProfile()&&e.target.id==='jp-lang'){JP.extraLang=e.target.checked;if(B.db)enqueue('japaneseProgress/progress',()=>B.db.collection('japaneseProgress').doc('progress').set({extraLang:JP.extraLang},{merge:true}));jpRender();}});
document.addEventListener('submit',e=>{if(!jpProfile()||e.target.id!=='jp-form')return;e.preventDefault();const f=new FormData(e.target);const txt=String(f.get('text')||'').trim(),tr=String(f.get('translation')||'').trim();if(!txt||!tr)return;const id='jpw'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);put('items',id,{type:f.get('type'),lang:f.get('lang'),text:txt,translation:tr,example:String(f.get('example')||''),owner:'me',both:true,srs:{},createdAt:Date.now()});toast('Карточка сохранена 🌱');JP.tab='words';jpRender();});

boot();
})();
</script>

</body></html>
